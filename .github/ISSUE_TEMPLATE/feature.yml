name: Feature proposal
description: Propose a focused improvement to evidence quality, privacy, portability, or listening value.
title: "[Proposal] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failure or limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks and tradeoffs
      description: Include privacy, cost, complexity, and editorial effects.
    validations:
      required: true
