name: Bug report
description: Report a reproducible problem without sharing private source material.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private sources, generated scripts, or personal audio.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the failure and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Pipeline stage
      options:
        - Configuration
        - Source loading
        - Scout
        - Critic
        - Editor
        - Producer
        - Validation
        - Audio rendering
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction with synthetic data
      description: Provide the smallest safe example that reproduces the problem.
    validations:
      required: true
